apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gomi-no-hi.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gomi-no-hi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "gomi-no-hi.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gomi-no-hi.backend.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/backend-secret.yaml") . | sha256sum }}
    spec:
      {{- include "gomi-no-hi.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: backend
          image: {{ include "gomi-no-hi.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GIN_MODE
              value: {{ .Values.backend.env.GIN_MODE | quote }}
            - name: REDIS_ADDR
              value: "{{ .Values.redis.host }}:{{ .Values.redis.port }}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | default (include "gomi-no-hi.backend.fullname" .) }}
                  key: REDIS_PASSWORD
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | default (include "gomi-no-hi.backend.fullname" .) }}
                  key: VAPID_PUBLIC_KEY
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | default (include "gomi-no-hi.backend.fullname" .) }}
                  key: VAPID_PRIVATE_KEY
            - name: VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | default (include "gomi-no-hi.backend.fullname" .) }}
                  key: VAPID_SUBJECT
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
