apiVersion: v1
kind: Service
metadata:
  name: {{ include "gomi-no-hi.redis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gomi-no-hi.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gomi-no-hi.redis.selectorLabels" . | nindent 4 }}
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: redis
      protocol: TCP
