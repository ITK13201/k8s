apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "gomi-no-hi.backend.fullname" . }}-notify
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gomi-no-hi.labels" . | nindent 4 }}
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          {{- include "gomi-no-hi.imagePullSecrets" . | nindent 10 }}
          restartPolicy: OnFailure
          containers:
            - name: notify
              image: {{ include "gomi-no-hi.backendImage" . }}
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command: ["/api", "notify"]
              env:
                - name: REDIS_ADDR
                  value: "{{ .Values.redis.host }}:{{ .Values.redis.port }}"
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backend.existingSecret | default (include "gomi-no-hi.backend.fullname" .) }}
                      key: REDIS_PASSWORD
                - name: VAPID_PUBLIC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backend.existingSecret | default (include "gomi-no-hi.backend.fullname" .) }}
                      key: VAPID_PUBLIC_KEY
                - name: VAPID_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backend.existingSecret | default (include "gomi-no-hi.backend.fullname" .) }}
                      key: VAPID_PRIVATE_KEY
                - name: VAPID_SUBJECT
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backend.existingSecret | default (include "gomi-no-hi.backend.fullname" .) }}
                      key: VAPID_SUBJECT
              {{- with .Values.backend.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
