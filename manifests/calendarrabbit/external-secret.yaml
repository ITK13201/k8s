---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calendarrabbit-backend-secret
  namespace: calendarrabbit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: calendarrabbit-backend-secret
    creationPolicy: Owner
  data:
  - secretKey: CLAUDE_API_KEY
    remoteRef:
      key: calendarrabbit-backend-secret
      property: CLAUDE_API_KEY
  - secretKey: DB_PASSWORD
    remoteRef:
      key: calendarrabbit-backend-secret
      property: DB_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calendarrabbit-mysql-secret
  namespace: calendarrabbit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: calendarrabbit-mysql-secret
    creationPolicy: Owner
  data:
  - secretKey: MYSQL_PASSWORD
    remoteRef:
      key: calendarrabbit-mysql-secret
      property: MYSQL_PASSWORD
  - secretKey: MYSQL_ROOT_PASSWORD
    remoteRef:
      key: calendarrabbit-mysql-secret
      property: MYSQL_ROOT_PASSWORD
