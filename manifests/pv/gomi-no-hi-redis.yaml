---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gomi-no-hi-redis-pv
  labels:
    target-app: gomi-no-hi-redis
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  local:
    path: /mnt/hdd/data/k8s/pv/gomi-no-hi/redis
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: Exists
