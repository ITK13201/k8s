---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-helm-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-helm-repo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: helm
        name: ghcr-itk13201
        url: ghcr.io/itk13201
        enableOCI: "true"
        username: itk13201
        password: "{{ .token }}"
  data:
  - secretKey: token
    remoteRef:
      key: github-pat
      property: token
